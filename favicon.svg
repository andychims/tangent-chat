<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#111113"/>
  <defs>
    <linearGradient id="g" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Stem -->
  <line x1="10" y1="10" x2="10" y2="22" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Main branch continues straight -->
  <line x1="10" y1="16" x2="22" y2="16" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tangent branch angles up-right -->
  <line x1="10" y1="10" x2="22" y2="22" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrowhead on straight branch -->
  <polyline points="19,13 22,16 19,19" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Arrowhead on angled branch -->
  <polyline points="18.5,20 22,22 20,18.5" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
